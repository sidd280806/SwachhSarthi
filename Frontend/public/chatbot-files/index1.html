    async function processAIResponse(input) {
    const queryText = input.toLowerCase();
    let response = "";

    // A. COMPLAINT FILING LOGIC (e.g., "Uttam in Thane garbage not cleaned")
    if (queryText.includes("not cleaned") || queryText.includes("complaint")) {
        const words = queryText.split(" ");
        // Simple extraction logic
        const city = words.find(w => ["thane", "mumbai", "pune"].includes(w)) || "Unknown";
        
        try {
            await window.fs.collection(window.fs, "complaints").add({
                userName: "Chatbot User",
                city: city,
                desc: input,
                status: "Pending",
                createdAt: new Date()
            });
            response = `Aapki complaint ${city} ke liye register ho gayi hai. Status: Pending.`;
        } catch (e) {
            response = "Complaint register karne mein dikat aa rahi hai.";
        }
    }

    // B. STATUS & RISK FETCH LOGIC (Firestore se data lana)
    else if (queryText.includes("risk") || queryText.includes("status")) {
        const cityName = queryText.split(" ").pop(); // Last word ko city maan rahe hain
        
        const q = query(collection(window.fs, "complaints"), where("city", "==", cityName));
        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            let count = querySnapshot.size;
            let lastStatus = querySnapshot.docs[0].data().status;
            let risk = count >= 5 ? "Critical" : count >= 3 ? "Moderate" : "Low";
            
            response = `Data for ${cityName}:\n• Risk Level: ${risk}\n• Complaints: ${count}\n• Latest Status: ${lastStatus}`;
        } else {
            response = `Sorry, ${cityName} ke liye koi record nahi mila.`;
        }
    } 
    else {
        response = "I can help with Risk Levels and Complaint Status. Try 'Thane risk level'.";
    }

    addMessage(response, 'bot-msg');
}

function getLiveLocation() {
    if (!navigator.geolocation) {
        addMessage("Location not supported.", "bot-msg");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        document.getElementById("map").style.display = "block";

        const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat, lng },
            zoom: 15
        });

        new google.maps.Marker({
            position: { lat, lng },
            map: map
        });

        addMessage(
          `Live location detected (Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)})`,
          "bot-msg"
        );
    });
}
